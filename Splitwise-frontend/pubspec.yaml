name: splitwise_frontend
description: "Splitwise-like expense sharing frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Storage (safe for non-symlink env)
  shared_preferences: ^2.2.2

  # UI / UX
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Utils
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
